<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer circle segment representing G -->
  <path d="M 80 35 C 73 20, 52 14, 35 25 C 18 36, 15 58, 26 75 C 37 92, 58 95, 75 84 C 84 78, 88 68, 88 56 L 50 56" 
        stroke="url(#brand-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Digital connection nodes -->
  <circle cx="80" cy="35" r="7" fill="#6366F1" />
  <circle cx="88" cy="56" r="7" fill="#2563EB" />
  <circle cx="50" cy="56" r="5" fill="#10B981" />
  
  <!-- Connected networks -->
  <line x1="80" y1="35" x2="88" y2="56" stroke="#6366F1" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="50" y1="56" x2="26" y2="75" stroke="#3B82F6" stroke-width="1.5" opacity="0.5" />

  <defs>
    <linearGradient id="brand-grad" x1="20" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
</svg>
