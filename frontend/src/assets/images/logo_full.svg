<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Embedded Logo Mark -->
  <g transform="translate(10, -10)">
    <!-- Outer circle segment representing G -->
    <path d="M 80 35 C 73 20, 52 14, 35 25 C 18 36, 15 58, 26 75 C 37 92, 58 95, 75 84 C 84 78, 88 68, 88 56 L 50 56" 
          stroke="url(#brand-grad-full)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Digital connection nodes -->
    <circle cx="80" cy="35" r="7" fill="#6366F1" />
    <circle cx="88" cy="56" r="7" fill="#2563EB" />
    <circle cx="50" cy="56" r="5" fill="#10B981" />
    <!-- Connected networks -->
    <line x1="80" y1="35" x2="88" y2="56" stroke="#6366F1" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- Logotype Text -->
  <text x="115" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" letter-spacing="-0.02em">GovGuide</text>
  <text x="228" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#6366F1" letter-spacing="-0.02em">AI</text>
  
  <text x="115" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#CBD5E1" letter-spacing="0.08em">SECURE CITIZEN PORTAL</text>

  <defs>
    <linearGradient id="brand-grad-full" x1="20" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
</svg>
